name: Svelte Latest

# dist is built against the svelte peer floor (packages/svelte-lens pins its
# devDependency), and Dependabot ignores svelte workspace-wide so the floor is
# only raised deliberately. That also freezes apps/e2e-app's svelte, so this
# workflow runs the E2E suite with the e2e app upgraded to the latest svelte:
# floor-built dist must keep working on newer releases, whose
# svelte/internal/client is not a stable API across 5.x minors.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  e2e-svelte-latest:
    name: E2E (latest Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Upgrade the e2e app to the latest svelte
        run: pnpm --filter @svelte-lens/e2e-app add --save-dev --ignore-scripts svelte@latest

      - name: Verify floor-built dist runs against latest svelte
        run: |
          latest=$(npm view svelte version)
          resolved() { node -p "require(require.resolve('svelte/package.json', { paths: ['$1'] })).version"; }
          floor=$(node -p "require('./packages/svelte-lens/package.json').devDependencies.svelte")
          app=$(resolved apps/e2e-app)
          lib=$(resolved packages/svelte-lens)
          echo "latest=$latest e2e-app=$app svelte-lens=$lib floor=$floor"
          test "$app" = "$latest" || { echo "e2e app is not on the latest svelte"; exit 1; }
          test "$lib" = "$floor" || { echo "svelte-lens is not building against its floor"; exit 1; }

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @svelte-lens/e2e-app exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @svelte-lens/e2e-app test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        if: failure()
        with:
          name: playwright-report-svelte-latest
          path: apps/e2e-app/test-results
          retention-days: 7
