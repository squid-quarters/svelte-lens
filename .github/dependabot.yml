version: 2
updates:
  # npm dependencies in the root + workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Only widen ranges when the new version falls outside them. The default
    # "increase" also raises peerDependencies floors (svelte), which would
    # silently drop support for consumers' older versions in a patch release.
    versioning-strategy: increase-if-necessary
    groups:
      # Group all dev tooling updates into one PR to reduce noise
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group runtime patch/minor bumps too
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # @types/node tracks the minimum supported Node (engines: >=20), not the
    # latest release — newer majors would type-check APIs absent at runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The package builds against its svelte peer floor (devDependency pinned
      # to the peerDependencies minimum) so dist only uses internals that exist
      # there. Raise both together, deliberately, in a changeset — never via a
      # devDependency-only bump (the package test enforces the pin).
      # Ignore rules are workspace-wide, so this also freezes apps/e2e-app's
      # svelte; workflows/svelte-latest.yml covers forward compatibility by
      # running the E2E suite with the e2e app on the latest svelte.
      - dependency-name: "svelte"
    # include: scope yields "chore(deps): …" / "chore(deps-dev): …"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # changesets/action v2 requires Changesets CLI v3; migrate both together.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
