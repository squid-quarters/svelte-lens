name: Version

on:
  push:
    branches: [main]
    # This workflow exists solely to process changesets, so trigger only
    # on .changeset/** changes (additions open/update the Version PR;
    # the consuming "chore: version packages" commit is filtered by the
    # job-level if). The previous paths-ignore list excluded "**.md",
    # which also matched .changeset/*.md and made the documented release
    # flow unrunnable.
    paths:
      - ".changeset/**"
  # Manual re-run hook for when the push-triggered run fails (e.g.
  # transient permission or registry errors).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no permissions; grant explicitly per job.
permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write          # for the version-bump commit
      pull-requests: write     # for the Version PR
    # Don't run on the version-bump commit itself — publishing is a
    # separate step triggered by creating a GitHub Release.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: version packages') }}"
    outputs:
      pr: ${{ steps.changesets.outputs.pullRequestNumber }}
      sha: ${{ steps.pushed.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          # changesets/action needs full git history to generate changelogs.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or Update Version PR
        id: changesets
        # Held at v1: v2 renames these inputs (and throws on the old names)
        # and requires Changesets CLI v3. Migrate both together.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # pin@v1.9.0
        with:
          # "pnpm run version" — the bare "pnpm version" invokes pnpm's
          # builtin version command, not the package.json script, so the
          # changeset bump never ran.
          version: pnpm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action leaves the commit it pushed checked out.
      - name: Record the pushed commit
        id: pushed
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The Version PR is pushed with GITHUB_TOKEN, whose pull_request runs
  # wait for a maintainer's approval (and dispatched runs don't count for
  # branch protection), so its required checks would never report. An empty
  # commit pushed with a GitHub App token triggers CI normally.
  # A separate job keeps the App token away from the dependency and
  # changeset code above: this job installs nothing and runs only pinned
  # first-party actions and git.
  trigger-ci:
    name: Run CI on the Version PR
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # pin@v3.3.0
        with:
          client-id: ${{ vars.VERSION_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_PR_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          # The exact commit the version job pushed, not whatever the
          # branch points to now.
          ref: ${{ needs.version.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Push an empty commit as the App
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ci: run checks on the Version PR"
          # Not forced, so it only lands if the branch still points at that
          # commit; if it moved, a newer version run handles it.
          git push origin "HEAD:refs/heads/changeset-release/$GITHUB_REF_NAME"
