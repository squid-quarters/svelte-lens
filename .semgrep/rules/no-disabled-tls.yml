rules:
  - id: domaine-no-disabled-tls
    languages: [javascript, typescript]
    severity: ERROR
    message: Keep TLS certificate verification enabled; use a trusted CA or local HTTP emulators.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: "{ rejectUnauthorized: false, ... }"
      - pattern: $OPTIONS.rejectUnauthorized = false
