name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".prettierignore"
      - ".prettierrc"
      - ".editorconfig"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/version.yml"
      - ".github/workflows/smoke-test.yml"
  # No paths filter on pull_request: all six CI checks are required by
  # branch protection, so skipping them (e.g. for docs-only or changeset
  # PRs) leaves the PR permanently unmergeable.
  pull_request:
    branches: [main]
  # The Version PR is opened by GITHUB_TOKEN, whose events never trigger
  # workflows, so version.yml dispatches CI on the PR branch instead. Its
  # check runs land on the branch head and satisfy the required checks.
  workflow_dispatch:

concurrency:
  # Branch-scoped for PRs and dispatches, so a newer run replaces an older
  # one; pushes to main each run to completion.
  group: ${{ github.workflow }}-${{ github.event_name != 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Default to no permissions; CI is read-only.
permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test:ci

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm test:security

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - run: pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @svelte-lens/e2e-app exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @svelte-lens/e2e-app test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e-app/test-results
          retention-days: 7

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Validate tarball, exports, CLI, MCP
        run: pnpm --filter @gear-null/svelte-lens test:package

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Verify dist artifacts
        run: |
          test -f packages/svelte-lens/dist/index.js || (echo "svelte-lens dist missing" && exit 1)
          test -f packages/svelte-lens/dist/cli/cli.js || (echo "cli dist missing" && exit 1)
          test -f packages/svelte-lens/dist/mcp/cli.js || (echo "mcp dist missing" && exit 1)
          test -f packages/svelte-lens/bin/cli.js || (echo "cli bin missing" && exit 1)
          test -f packages/svelte-lens/bin/mcp.js || (echo "mcp bin missing" && exit 1)
