name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (semver, e.g. 1.0.1). Must match package.json."
        required: true

# Don't cancel in-progress releases — partial publishes are bad.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; grant explicitly per job.
permissions: {}

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment, and the
    # environment only accepts release tags and main (for manual runs). A
    # run without it, e.g. from an older release.yml, can't publish.
    environment: npm-publish
    permissions:
      id-token: write # for npm OIDC trusted publishing + provenance
      contents: read # checkout only — GitHub Release already exists
    outputs:
      published_version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0

      # Defence in depth only: a release runs the release.yml of its tagged
      # commit, so a release of an older commit skips this check. Publishing
      # is actually restricted by repo settings (environment / tag rules).
      - name: Verify the commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main; refusing to publish."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Tokenless OIDC trusted publishing requires npm CLI >= 11.5.1;
      # Node 22 bundles npm 10.x. The npm-side Trusted Publisher must be
      # configured for this repo+workflow at npmjs.com (package settings).
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Resolve target version
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            # Tag format: @gear-null/svelte-lens@1.2.3 → extract "1.2.3"
            VERSION="${RELEASE_TAG##*@}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            echo "No version source (not a release event and no version input)"
            exit 1
          fi
          # Validate semver format.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Rejected version (not semver): $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json matches release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./packages/svelte-lens/package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Version mismatch: package.json has $PACKAGE_VERSION, expected $VERSION"
            echo "Merge the Version PR first, then create the GitHub Release."
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Publish to npm with provenance
        env:
          # Release events publish via OIDC trusted publishing; the
          # long-lived NPM_TOKEN is only injected for emergency manual
          # publishes (workflow_dispatch). The variable must still exist
          # (empty) so setup-node's .npmrc env substitution succeeds.
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          cd packages/svelte-lens
          npm publish --provenance --no-git-checks
          echo "Published @gear-null/svelte-lens@$(node -p "require('./package.json').version")"

      - name: Summarize release
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "## Published @gear-null/svelte-lens@$VERSION"
            echo "Provenance: enabled (OIDC trusted publishing)"
          } >> "$GITHUB_STEP_SUMMARY"
