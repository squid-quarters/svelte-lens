version: 2
updates:
  # npm dependencies in the root + workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group all dev tooling updates into one PR to reduce noise
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group runtime patch/minor bumps too
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # @types/node tracks the minimum supported Node (engines: >=20), not the
    # latest release — newer majors would type-check APIs absent at runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # include: scope yields "chore(deps): …" / "chore(deps-dev): …"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # changesets/action v2 requires Changesets CLI v3; migrate both together.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
