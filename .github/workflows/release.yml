name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (semver, e.g. 1.0.1). Must match package.json."
        required: true

# Don't cancel in-progress releases — partial publishes are bad.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default to no permissions; grant explicitly per job.
permissions: {}

jobs:
  verify:
    name: Build and verify the installed release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Defence in depth only: a release runs the release.yml of its tagged
      # commit, so a release of an older commit skips this check. Publishing
      # is actually restricted by repo settings (environment / tag rules).
      - name: Verify the commit is on main
        id: source
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main; refusing to publish."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # pin@v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Tokenless OIDC trusted publishing requires npm CLI >= 11.5.1;
      # Node 22 bundles npm 10.x. The npm-side Trusted Publisher must be
      # configured for this repo+workflow at npmjs.com (package settings).
      - run: npm install -g npm@11.21.3 --ignore-scripts

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build

      - name: Resolve target version
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            # Tag format: @gear-null/svelte-lens@1.2.3 → extract "1.2.3"
            VERSION="${RELEASE_TAG##*@}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            echo "No version source (not a release event and no version input)"
            exit 1
          fi
          # Validate semver format.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Rejected version (not semver): $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json matches release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./packages/svelte-lens/package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Version mismatch: package.json has $PACKAGE_VERSION, expected $VERSION"
            echo "Merge the Version PR first, then create the GitHub Release."
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Verify installed candidate and recovery before publishing
        run: pnpm release:verify

      - name: Retain the verified tarball and receipt
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release-candidate-${{ github.run_attempt }}
          path: |
            .local/release-candidate/candidate.tgz
            .local/release-candidate/verification.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # The environment accepts release tags and main for manual runs.
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@11.21.3 --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .local/release-candidate

      - name: Publish to npm with provenance
        env:
          # Release events publish via OIDC trusted publishing; the
          # long-lived NPM_TOKEN is only injected for emergency manual
          # publishes (workflow_dispatch). The variable must still exist
          # (empty) so setup-node's .npmrc env substitution succeeds.
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.NPM_TOKEN || '' }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/release-candidate.mjs --assert-verified
          npm publish ./.local/release-candidate/candidate.tgz --ignore-scripts --access public --provenance --no-git-checks
          echo "Published @gear-null/svelte-lens@$VERSION"

      - name: Summarize release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "## Published @gear-null/svelte-lens@$VERSION"
            echo "Provenance: enabled (OIDC trusted publishing)"
          } >> "$GITHUB_STEP_SUMMARY"
